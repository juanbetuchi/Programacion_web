<!DOCTYPE html>
<html lang='es'>

  <head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>TechStore - Iniciar sesión</title>
    <link rel='stylesheet' href='estilos.css'>
  </head>

  <body>

    <header>
      <h1>TechStore</h1>
      <nav>
        <ul>
          <li><a href='index.html'>Inicio</a></li>
          <li><a href='index.html#productos'>Productos</a></li>
          <li><a href='index.html#ofertas'>Ofertas</a></li>
          <li><a href='login.html'>Login</a></li>
        </ul>
      </nav>
    </header>

    <main>

      <section class='seccion-form'>
        <h2>Iniciar sesión</h2>

        <form id='form-login'>

          <div class='campo'>
            <label for='email'>Email *</label>
            <input type='email' id='email' name='email'
                   placeholder='tu@email.com' required>
          </div>

          <div class='campo'>
            <label for='password'>Contraseña *</label>
            <input type='password' id='password' name='password'
                   placeholder='Tu contraseña' required>
          </div>

          <p id='mensaje-exito' class='mensaje-exito'></p>

          <button type='submit'>Iniciar sesión</button>

        </form>

        <p class='link-pie'>
          ¿No tenés cuenta? <a href='registro.html'>Registrate</a>
        </p>

      </section>

    </main>

    <footer>
      <h6>Juan Manuel Betuchi - Segundo año - 2026</h6>
    </footer>

    <script>
      const form    = document.getElementById('form-login');
      const mensaje = document.getElementById('mensaje-exito');

      form.addEventListener('submit', (event) => {
        event.preventDefault();

        const datos = Object.fromEntries(new FormData(event.target));

        console.log('Login:', { email: datos.email, password: datos.password });

        mensaje.textContent = `Sesión iniciada como ${datos.email}`;

        form.reset();
      });
    </script>

  </body>

</html>
